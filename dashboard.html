<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiRover Control</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #1a1a22;
      --accent: #00d4ff;
      --accent-dim: #0099bb;
      --text: #e0e0e8;
      --muted: #8888a0;
      --danger: #ff4466;
      --success: #00cc88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
      letter-spacing: 1px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .status-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--card);
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      font-size: 0.88rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.connected { background: var(--success); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 0.8rem;
      max-width: 320px;
      width: 100%;
      margin-bottom: 2rem;
    }

    .btn {
      background: var(--card);
      border: 2px solid #2a2a35;
      color: var(--text);
      font-size: 1.4rem;
      height: 70px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
    }

    .btn:hover { border-color: var(--accent-dim); }
    .btn:active, .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      transform: scale(0.96);
    }

    .btn.forward { grid-column: 2; grid-row: 1; }
    .btn.left    { grid-column: 1; grid-row: 2; }
    .btn.stop    { grid-column: 2; grid-row: 2; background: #2a1a1a; border-color: #4a2a2a; }
    .btn.right   { grid-column: 3; grid-row: 2; }
    .btn.back    { grid-column: 2; grid-row: 3; }

    .btn.stop:active, .btn.stop.active {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .speed-section {
      width: 100%;
      max-width: 320px;
      background: var(--card);
      padding: 1.2rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }

    .speed-section label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .info {
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      max-width: 380px;
      line-height: 1.5;
    }

    .key-hint {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>PiRover</h1>
  <p class="subtitle">Local Control Dashboard</p>

  <div class="status-bar">
    <div class="status">
      <div class="dot" id="netDot"></div>
      <span id="netText">Disconnected (mock)</span>
    </div>
    <div class="status">
      <div class="dot" id="padDot"></div>
      <span id="padText">No controller</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn forward" data-dir="forward">▲</button>
    <button class="btn left"    data-dir="left">◀</button>
    <button class="btn stop"    data-dir="stop">■</button>
    <button class="btn right"   data-dir="right">▶</button>
    <button class="btn back"    data-dir="back">▼</button>
  </div>

  <div class="speed-section">
    <label>
      <span>Speed</span>
      <span id="speedValue">60%</span>
    </label>
    <input type="range" id="speed" min="0" max="100" value="60">
  </div>

  <p class="info">
    Mouse, touch, keyboard <strong>and Xbox controller</strong> all work.<br>
    Left stick / D-pad = move &nbsp;•&nbsp; Right trigger = speed &nbsp;•&nbsp; A/B/X/Y or Start = stop
  </p>

  <p class="key-hint">Keyboard: Arrow keys + Space</p>

  <script>
    // ========== DOM ==========
    const netDot     = document.getElementById('netDot');
    const netText    = document.getElementById('netText');
    const padDot     = document.getElementById('padDot');
    const padText    = document.getElementById('padText');
    const speedInput = document.getElementById('speed');
    const speedValue = document.getElementById('speedValue');
    const buttons    = document.querySelectorAll('.btn[data-dir]');

    let currentDir = 'stop';
    let speed = 60;
    let gamepadIndex = null;

    // Simulate network connection
    setTimeout(() => {
      netDot.classList.add('connected');
      netText.textContent = 'Connected (localhost mock)';
    }, 1000);

    // ========== Command sender ==========
    function sendCommand(direction, speed = 0, a_pressed = false) {
      currentDir = direction;
      console.log(`→ ${direction} @ ${speed}%  A:${a_pressed}`);

      fetch('http://localhost:5000/api/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ direction, speed, a_pressed })
      }).catch(err => console.log('Server not running yet'));
    }

    function setActiveButton(dir) {
      buttons.forEach(b => b.classList.toggle('active', b.dataset.dir === dir));
    }

    // ========== Mouse / Touch ==========
    buttons.forEach(btn => {
      const dir = btn.dataset.dir;

      const start = (e) => {
        e.preventDefault();
        btn.classList.add('active');
        sendCommand(dir);
      };
      const end = () => {
        btn.classList.remove('active');
        if (dir !== 'stop') sendCommand('stop');
      };

      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
      btn.addEventListener('mouseleave', end);
      btn.addEventListener('touchstart', start, {passive: false});
      btn.addEventListener('touchend', end);
    });

    // ========== Speed slider ==========
    speedInput.addEventListener('input', () => {
      speed = +speedInput.value;
      speedValue.textContent = speed + '%';
    });

    // ========== Keyboard ==========
    const keyMap = {
      ArrowUp: 'forward', ArrowDown: 'back',
      ArrowLeft: 'left', ArrowRight: 'right',
      ' ': 'stop'
    };

    document.addEventListener('keydown', e => {
      if (keyMap[e.key]) {
        e.preventDefault();
        const dir = keyMap[e.key];
        setActiveButton(dir);
        sendCommand(dir);
      }
    });

    document.addEventListener('keyup', e => {
      if (keyMap[e.key] && keyMap[e.key] !== 'stop') {
        setActiveButton('stop');
        sendCommand('stop');
      }
    });

    // ========== Xbox / Gamepad support ==========
    window.addEventListener('gamepadconnected', (e) => {
  gamepadIndex = e.gamepad.index;
  padDot.classList.add('connected');
  padText.textContent = e.gamepad.id.includes('Xbox') ? 'Xbox controller' : 'Gamepad connected';
});

window.addEventListener('gamepaddisconnected', (e) => {
  if (gamepadIndex === e.gamepad.index) {
    gamepadIndex = null;
    padDot.classList.remove('connected');
    padText.textContent = 'No controller';
    sendCommand('stop', 0);
    setActiveButton('stop');
  }
});

function pollGamepad() {
  if (gamepadIndex === null) {
    requestAnimationFrame(pollGamepad);
    return;
  }

  const gp = navigator.getGamepads()[gamepadIndex];
  if (!gp) {
    requestAnimationFrame(pollGamepad);
    return;
  }

  const deadzone = 0.18;
  let direction = 'stop';
  let stickSpeed = 0;

  // Left stick (axes 0 = X, 1 = Y)
  const x = gp.axes[0] || 0;
  const y = gp.axes[1] || 0;
  const magnitude = Math.min(1, Math.sqrt(x * x + y * y));

  if (magnitude > deadzone) {
    stickSpeed = Math.round(magnitude * 100);

    // Determine dominant direction
    if (Math.abs(y) > Math.abs(x)) {
      direction = y < 0 ? 'forward' : 'back';
    } else {
      direction = x < 0 ? 'left' : 'right';
    }
  }

  // A button (button 0)
  const aPressed = gp.buttons[0]?.pressed || false;

  // Also still support D-pad
  if (gp.buttons[12]?.pressed) { direction = 'forward'; stickSpeed = 100; }
  if (gp.buttons[13]?.pressed) { direction = 'back';    stickSpeed = 100; }
  if (gp.buttons[14]?.pressed) { direction = 'left';    stickSpeed = 100; }
  if (gp.buttons[15]?.pressed) { direction = 'right';   stickSpeed = 100; }

  // Force stop buttons
  if (gp.buttons[1]?.pressed || gp.buttons[2]?.pressed || gp.buttons[3]?.pressed || gp.buttons[9]?.pressed) {
    direction = 'stop';
    stickSpeed = 0;
  }

  // Update UI speed slider to match stick
  if (stickSpeed !== speed) {
    speed = stickSpeed;
    speedInput.value = speed;
    speedValue.textContent = speed + '%';
  }

  setActiveButton(direction);
  sendCommand(direction, stickSpeed, aPressed);

  requestAnimationFrame(pollGamepad);
}

requestAnimationFrame(pollGamepad);
  </script>
</body>
</html>
